{{- $src := .Get "src" -}}
{{- $sort := .Get "sort" | default false -}}
{{- $id := printf "tbl-%d" (now.UnixNano) -}}

<div class="rt2-table-wrap">

  <!-- Search -->
  <input
    id="{{ $id }}-q"
    class="rt2-table-search"
    placeholder="Search…"
    aria-label="Search table"
  >

  <!-- Table -->
  <div class="rt2-table-scroll">
    <table id="{{ $id }}">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div id="{{ $id }}-pager" class="rt2-pager"></div>
</div>

<script>
(function(){
  const id = "{{ $id }}";
  const enableSort = {{ if or (eq $sort true) (eq $sort "true") }}true{{ else }}false{{ end }};
  const PAGE_SIZE = 5;

  const table = document.getElementById(id);
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  const searchBox = document.getElementById(id + "-q");
  const pager = document.getElementById(id + "-pager");

  let H = [];
  let base = [];
  let filtered = [];
  let page = 1;

  function parseCSV(t){
    const rows = [];
    let row = [], col = "", q = false;

    for(let i=0;i<t.length;i++){
      const c=t[i], n=t[i+1];
      if(q){
        if(c === '"' && n === '"'){ col+='"'; i++; }
        else if(c === '"'){ q=false; }
        else col+=c;
      } else {
        if(c === '"') q=true;
        else if(c === ','){ row.push(col); col=""; }
        else if(c === '\n'){
          row.push(col);
          rows.push(row);
          row=[]; col="";
        } else if(c !== '\r') col+=c;
      }
    }
    if(col.length || row.length){ row.push(col); rows.push(row); }
    return rows.filter(r => r.length && r.some(c => c.trim() !== ""));
  }

  function renderTable(headers, rows){
    thead.innerHTML = "";
    tbody.innerHTML = "";

    const trh = document.createElement("tr");
    headers.forEach((h,i)=>{
      const th = document.createElement("th");
      th.textContent = h;
      if(enableSort){
        th.style.cursor = "pointer";
        th.onclick = () => sortBy(i);
      }
      trh.appendChild(th);
    });
    thead.appendChild(trh);

    rows.forEach(r=>{
      const tr = document.createElement("tr");
      r.forEach(c=>{
        const td = document.createElement("td");
        const v = (c || "").toString().trim();
        if(/^https?:\/\//.test(v)){
          const a = document.createElement("a");
          a.href = v;
          a.textContent = "link";
          a.target = "_blank";
          td.appendChild(a);
        } else {
          td.textContent = c;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function renderPager(){
  pager.innerHTML = "";

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

  function makeBtn(label, target, disabled){
    const b = document.createElement("button");
    b.textContent = label;
    b.disabled = disabled;
    b.onclick = () => {
      page = target;
      update();
    };
    return b;
  }

  pager.appendChild(
    makeBtn("⏮", 1, page === 1)
  );
  pager.appendChild(
    makeBtn("◀", Math.max(1, page - 1), page === 1)
  );

  const status = document.createElement("span");
  status.className = "rt2-pager-status";
  status.textContent = `Page ${page} of ${totalPages}`;
  pager.appendChild(status);

  pager.appendChild(
    makeBtn("▶", Math.min(totalPages, page + 1), page === totalPages)
  );
  pager.appendChild(
    makeBtn("⏭", totalPages, page === totalPages)
  );
}

  function update(){
    const start = (page-1)*PAGE_SIZE;
    const end = start + PAGE_SIZE;
    renderTable(H, filtered.slice(start,end));
    renderPager();
  }

  function applySearch(){
    const q = searchBox.value.toLowerCase();
    filtered = !q
      ? base.slice()
      : base.filter(r => r.some(c =>
          (c || "").toString().toLowerCase().includes(q)
        ));
    page = 1;
    update();
  }

  function sortBy(i){
    base.sort((a,b)=>{
      const x=a[i]||"", y=b[i]||"";
      const nx=parseFloat(x), ny=parseFloat(y);
      if(!isNaN(nx)&&!isNaN(ny)) return nx-ny;
      return x.toString().localeCompare(
        y.toString(),
        undefined,
        {numeric:true,sensitivity:"base"}
      );
    });
    applySearch();
  }

  fetch("{{ $src }}")
    .then(r=>r.text())
    .then(t=>{
      const R = parseCSV(t);
      H = R[0] || [];
      base = R.slice(1);
      filtered = base.slice();
      update();

      let timer=null;
      searchBox.addEventListener("input",()=>{
        clearTimeout(timer);
        timer=setTimeout(applySearch,150);
      });
    });
})();
</script>

<style>
.rt2-table-search{
  width:100%;
  padding:.5rem .6rem;
  margin:0 0 .75rem 0;
  border:1px solid #e5e7eb;
  border-radius:.375rem;
  font-size:.95rem;
}
.rt2-table-search:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 1px #2563eb22;
}

.rt2-table-scroll{overflow:auto}

#{{ $id }}{
  border-collapse:collapse;
  width:100%;
}

#{{ $id }} th,
#{{ $id }} td{
  border-bottom:1px solid #e5e7eb;
  padding:.5rem;
  text-align:left;
}

#{{ $id }} tr:hover td{
  background:#fafafa;
}

.rt2-pager{
  display:flex;
  gap:.25rem;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:.75rem;
}

.rt2-pager button{
  padding:.35rem .6rem;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:.375rem;
  cursor:pointer;
}

.rt2-pager button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.rt2-pager button:disabled{
  opacity:.4;
  cursor:default;
}
</style>
